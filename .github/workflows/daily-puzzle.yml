name: Daily puzzle generation

on:
  schedule:
    # GitHub cron is UTC. Run redundant catch-up windows around and after
    # America/New_York midnight. Scheduled workflows can be delayed or skipped;
    # the catch-up script is idempotent and fills any missing dates through today.
    - cron: '17,47 4-8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD, today, or catch-up'
        required: false
        default: 'catch-up'

permissions:
  contents: write

concurrency:
  group: daily-puzzle-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add missing America/New_York puzzles
        run: |
          DATE_INPUT="${{ github.event.inputs.date || 'catch-up' }}"
          npm run add:daily-puzzle -- --date="${DATE_INPUT}"
          npm run generate:daily-words
      - run: npm run check:daily-words
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - name: Commit generated puzzle
        run: |
          if git diff --quiet; then
            echo "No new puzzle to commit."
            exit 0
          fi
          DATE=$(TZ=America/New_York date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-puzzles.json src/data/generated-daily-puzzles.ts package.json package-lock.json
          git commit -m "chore: add daily puzzle ${DATE}"
          git push
