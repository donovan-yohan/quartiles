name: Daily puzzle generation

on:
  schedule:
    # GitHub cron is UTC. Run at both likely America/New_York midnight offsets.
    # Avoid minute 0 because GitHub scheduled workflows can be delayed/dropped at
    # the top of the hour; the generator is idempotent, so the second run exits
    # cleanly if the date exists.
    - cron: '13 4,5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add today's America/New_York puzzle
        run: |
          npm run add:daily-puzzle -- --date=today
          npm run generate:daily-words
      - run: npm run check:daily-words
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - name: Commit generated puzzle
        run: |
          if git diff --quiet; then
            echo "No new puzzle to commit."
            exit 0
          fi
          DATE=$(TZ=America/New_York date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-puzzles.json src/data/generated-daily-puzzles.ts package.json package-lock.json
          git commit -m "chore: add daily puzzle ${DATE}"
          git push
